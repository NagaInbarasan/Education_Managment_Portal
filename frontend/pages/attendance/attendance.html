<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Phazon Academic — Attendance Module</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/variables.css"/>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/components.css"/>
  <link rel="stylesheet" href="../../css/layout.css"/>
  <link rel="stylesheet" href="../../css/responsive.css"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#000000", "secondary": "#4648d4", "background": "#f8f9ff",
            "surface": "#f8f9ff", "on-surface": "#0d1c2e", "on-surface-variant": "#45464d",
            "outline-variant": "#c6c6cd", "surface-container-lowest": "#ffffff", "surface-container-high": "#dce9ff"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-background h-full font-sans antialiased flex overflow-hidden">
  <!-- SideNav -->
  <nav class="hidden md:flex flex-col h-full w-[280px] z-50 bg-surface border-r border-outline-variant py-lg flex-shrink-0">
    <div class="px-md mb-xl flex items-center gap-sm">
      <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white font-bold shadow-sm">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">fact_check</span>
      </div>
      <div>
        <a href="../../index.html" class="font-headline-md text-headline-md font-black text-primary block">Phazon Academic</a>
        <p class="font-label-sm text-label-sm text-secondary font-bold">Attendance Module</p>
      </div>
    </div>
    <ul class="flex flex-col flex-grow">
      <li class="mb-2"><a class="flex items-center gap-sm text-on-surface-variant py-3 px-md hover:bg-surface-container-high hover:text-primary transition-all font-label-md text-label-md" href="../dashboard/dashboard.html"><span class="material-symbols-outlined">dashboard</span>Dashboard</a></li>
      <li class="mb-2"><a class="flex items-center gap-sm bg-primary-container text-on-primary-container border-l-4 border-secondary rounded-r-full py-3 px-md font-label-md text-label-md" href="attendance.html"><span class="material-symbols-outlined">fact_check</span>Attendance</a></li>
      <li class="mb-2"><a class="flex items-center gap-sm text-on-surface-variant py-3 px-md hover:bg-surface-container-high hover:text-primary transition-all font-label-md text-label-md" href="../assignments/assignments.html"><span class="material-symbols-outlined">assignment</span>Assignments</a></li>
      <li class="mb-2"><a class="flex items-center gap-sm text-on-surface-variant py-3 px-md hover:bg-surface-container-high hover:text-primary transition-all font-label-md text-label-md" href="../exams/exams.html"><span class="material-symbols-outlined">quiz</span>Exams</a></li>
      <li class="mb-2"><a class="flex items-center gap-sm text-on-surface-variant py-3 px-md hover:bg-surface-container-high hover:text-primary transition-all font-label-md text-label-md" href="../grades/grades.html"><span class="material-symbols-outlined">grade</span>Grades</a></li>
    </ul>
    <div class="px-md mt-auto pt-lg border-t border-outline-variant">
      <button onclick="PzAuth.logout()" class="w-full bg-secondary text-white font-label-md py-2.5 rounded-lg hover:opacity-90 transition-colors flex items-center justify-center gap-xs">
        <span class="material-symbols-outlined text-[18px]">logout</span>Logout
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-full overflow-y-auto relative p-lg">
    <header class="mb-lg">
      <h1 class="font-display-lg text-display-lg text-primary">Attendance Management</h1>
      <p class="font-body-lg text-on-surface-variant">Session tracking, roll calls, and attendance percentages.</p>
    </header>

    <div class="bg-surface-container-lowest p-lg rounded-xl border border-outline-variant shadow-sm mb-xl">
      <h3 class="font-headline-md text-primary mb-md">Attendance Summary</h3>
      <div id="att-summary-container" class="space-y-sm">
        <p class="text-on-surface-variant font-body-md">Loading attendance data...</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/state.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!PzAuth.requireAuthGuard()) return;
      try {
        const res = await PzAPI.authGet('/attendance/my');
        const container = document.getElementById('att-summary-container');
        if (res && res.summary && res.summary.length > 0) {
          container.innerHTML = res.summary.map(s => `
            <div class="p-md bg-surface rounded-lg border border-outline-variant flex justify-between items-center">
              <div>
                <div class="font-bold text-primary">${s.subject?.name || 'Subject'} (${s.subject?.code || ''})</div>
                <div class="text-xs text-on-surface-variant">${s.present_count} Present / ${s.total_sessions} Total Sessions</div>
              </div>
              <div class="font-headline-md font-bold text-secondary">${s.attendance_pct}%</div>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p class="text-on-surface-variant font-body-md">No attendance records found yet.</p>';
        }
      } catch (_) {}
    });
  </script>
</body>
</html>
