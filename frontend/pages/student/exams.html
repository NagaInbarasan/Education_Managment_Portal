<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Phazon Academic — My Exams</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/variables.css"/>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/components.css"/>
  <link rel="stylesheet" href="../../css/layout.css"/>
  <link rel="stylesheet" href="../../css/responsive.css"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#000000", "secondary": "#4648d4", "background": "#f8f9ff",
            "surface": "#f8f9ff", "on-surface": "#0d1c2e", "on-surface-variant": "#45464d",
            "outline-variant": "#c6c6cd", "surface-container-lowest": "#ffffff",
            "surface-container-high": "#dce9ff", "surface-container": "#e6eeff",
            "primary-container": "#131b2e", "on-primary-container": "#bec6e0"
          }
        }
      }
    }
  </script>
  <style>
    .nav-item { @apply flex items-center gap-3 text-on-surface-variant py-2.5 px-4 rounded-lg hover:bg-surface-container hover:text-primary transition-all duration-150 font-medium text-sm; }
    .nav-item.active { @apply bg-secondary text-white; }
    .nav-item .icon { @apply text-[20px]; }
    .nav-section { @apply text-[10px] font-bold uppercase tracking-widest text-on-surface-variant px-4 pt-4 pb-1; }
  </style>
</head>
<body class="bg-background text-on-surface h-full font-sans antialiased flex overflow-hidden">

  <!-- SideNav -->
  <nav class="hidden md:flex flex-col h-screen w-[260px] z-50 bg-surface border-r border-outline-variant flex-shrink-0">
    <div class="px-5 pt-6 pb-4 flex items-center gap-3 border-b border-outline-variant">
      <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center shadow-sm flex-shrink-0">
        <span class="material-symbols-outlined text-white text-[18px]" style="font-variation-settings:'FILL' 1">school</span>
      </div>
      <div class="min-w-0">
        <a href="../../index.html" class="font-bold text-primary text-base block truncate leading-tight">Phazon Academic</a>
        <p class="text-xs text-secondary font-semibold">Student Portal</p>
      </div>
    </div>

    <div class="px-4 py-3 border-b border-outline-variant">
      <div class="flex items-center gap-2.5 bg-surface-container rounded-xl px-3 py-2">
        <div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center text-white text-sm flex-shrink-0">
          <span class="material-symbols-outlined text-[16px]">school</span>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-primary truncate" id="nav-name">Student</p>
          <p class="text-xs text-on-surface-variant truncate" id="nav-email">student@phazon.edu</p>
        </div>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto px-3 py-2 space-y-0.5">
      <p class="nav-section">Dashboard</p>
      <a href="dashboard.html"                 class="nav-item"><span class="icon material-symbols-outlined">dashboard</span>Overview</a>
      <p class="nav-section">My Academics</p>
      <a href="../courses/courses.html"         class="nav-item"><span class="icon material-symbols-outlined">menu_book</span>My Courses</a>
      <a href="attendance.html"                class="nav-item"><span class="icon material-symbols-outlined">fact_check</span>Attendance</a>
      <a href="assignments.html"               class="nav-item"><span class="icon material-symbols-outlined">assignment</span>Assignments</a>
      <a href="exams.html"                     class="nav-item active"><span class="icon material-symbols-outlined">quiz</span>Exams</a>
      <a href="../grades/grades.html"           class="nav-item"><span class="icon material-symbols-outlined">grade</span>Grades</a>
    </div>

    <div class="px-3 py-4 border-t border-outline-variant space-y-1">
      <button onclick="PzAuth.logout()" class="nav-item w-full text-left text-red-600 hover:bg-red-50 hover:text-red-700">
        <span class="icon material-symbols-outlined">logout</span>Logout
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-full overflow-y-auto relative">
    
    <!-- Header -->
    <div id="main-header" class="bg-surface border-b border-outline-variant px-6 py-4 flex items-center justify-between sticky top-0 z-10">
      <div>
        <h1 class="text-xl font-bold text-primary">My Exams</h1>
        <p class="text-xs text-on-surface-variant mt-0.5">Take active examinations</p>
      </div>
      <span class="inline-flex items-center gap-1.5 bg-primary/10 text-primary text-xs font-bold px-3 py-1 rounded-full">
        <span class="material-symbols-outlined text-[13px]">school</span>STUDENT
      </span>
    </div>

    <div id="exam-list-view" class="p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="list-exams">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Exam Taking View -->
    <div id="exam-take-view" class="hidden absolute inset-0 bg-surface z-50 flex flex-col h-full">
      <div class="bg-primary text-white px-6 py-4 flex justify-between items-center shadow-md flex-shrink-0">
        <div>
          <h2 id="live-ex-title" class="text-lg font-bold">Exam Title</h2>
          <p id="live-ex-sub" class="text-xs text-primary-container font-medium mt-0.5">Subject</p>
        </div>
        <div class="flex items-center gap-4 bg-white/10 px-4 py-2 rounded-xl">
          <span class="material-symbols-outlined text-[24px]">timer</span>
          <span id="live-timer" class="text-xl font-bold font-mono tracking-wider">00:00</span>
        </div>
      </div>
      
      <div class="flex-1 overflow-y-auto p-6 bg-background">
        <div class="max-w-3xl mx-auto space-y-6" id="live-questions">
          <!-- Rendered via JS -->
        </div>
      </div>

      <div class="bg-surface border-t border-outline-variant px-6 py-4 flex justify-end flex-shrink-0">
        <button onclick="submitExam()" id="btn-submit" class="bg-secondary text-white font-bold py-3 px-8 rounded-xl hover:opacity-90 transition-opacity shadow-lg text-sm">
          Submit Exam
        </button>
      </div>
    </div>

  </main>

  <script src="../../js/config.js"></script>
<script src="../../js/state.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth-client.js"></script>
  <script>
    let exams = [];
    let currentExamId = null;
    let timerInterval = null;
    let examEndTime = null;
    let answersState = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!PzAuth.requireAuthGuard('student')) return;
      
      const session = JSON.parse(localStorage.getItem('pz_auth_session') || 'null');
      document.getElementById('nav-name').textContent = session.user.name;
      document.getElementById('nav-email').textContent = session.user.email;

      await loadExams();
    });

    async function loadExams() {
      try {
        const res = await PzAPI.authGet('/exams');
        if (res.success) {
          exams = res.data || [];
          renderExams();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderExams() {
      const container = document.getElementById('list-exams');
      container.innerHTML = '';
      if (exams.length === 0) {
        container.innerHTML = `<div class="col-span-full text-sm text-on-surface-variant">No exams available.</div>`;
        return;
      }

      const now = new Date();

      exams.forEach(ex => {
        const start = new Date(ex.start_at);
        const end = new Date(ex.end_at);
        
        let status = 'Upcoming';
        let statusClass = 'bg-gray-100 text-gray-800';
        let canStart = false;

        if (ex.status === 'COMPLETED') {
          status = 'Completed';
          statusClass = 'bg-gray-100 text-gray-800';
        } else if (now > end) {
          status = 'Ended';
          statusClass = 'bg-red-100 text-red-800';
        } else if (now >= start && now <= end) {
          status = 'Live';
          statusClass = 'bg-green-100 text-green-800';
          canStart = true;
        }

        container.innerHTML += `
          <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-5 shadow-sm flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-2">
                <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded ${statusClass}">${status}</span>
                <span class="text-xs font-semibold text-on-surface-variant">${ex.duration_minutes} min</span>
              </div>
              <h3 class="font-bold text-primary text-base">${ex.title}</h3>
              <p class="text-xs font-semibold text-secondary mt-1">${ex.subject?.name || ''}</p>
            </div>
            <div class="mt-5 border-t border-outline-variant pt-4 flex items-center justify-between">
              <div class="text-xs font-medium text-on-surface-variant">
                <span class="material-symbols-outlined text-[14px] align-middle mr-1">schedule</span>
                ${start.toLocaleDateString()} ${start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
              </div>
              ${canStart ? `<button onclick="startExam('${ex.id}')" class="bg-secondary text-white text-xs font-bold py-1.5 px-4 rounded hover:bg-secondary/90 transition shadow-sm">Start</button>` : ''}
            </div>
          </div>
        `;
      });
    }

    async function startExam(id) {
      if (!confirm("Starting the exam will begin your timer. Are you ready?")) return;
      try {
        // 1. Hit start endpoint to initialize attempt
        const startRes = await PzAPI.authPost(`/exams/${id}/start`);
        if (!startRes.success) return alert(startRes.message || 'Failed to start exam');
        
        const attempt = startRes.data;

        // 2. Fetch exam details + questions
        const exRes = await PzAPI.authGet(`/exams/${id}`);
        if (!exRes.success) return alert(exRes.message || 'Failed to fetch questions');

        const examData = exRes.data;
        currentExamId = id;
        answersState = [];
        
        // Calculate hard end time based on backend started_at and duration
        const startedAt = new Date(attempt.started_at);
        examEndTime = new Date(startedAt.getTime() + (examData.duration_minutes * 60000));
        
        // Ensure we don't exceed global exam end_at
        const globalEnd = new Date(examData.end_at);
        if (examEndTime > globalEnd) examEndTime = globalEnd;

        // Setup UI
        document.getElementById('exam-list-view').classList.add('hidden');
        document.getElementById('exam-take-view').classList.remove('hidden');
        document.getElementById('live-ex-title').textContent = examData.title;
        document.getElementById('live-ex-sub').textContent = examData.subject?.name;

        renderQuestions(examData.questions || []);
        startTimer();

      } catch (err) {
        alert(err.message);
      }
    }

    function renderQuestions(questions) {
      const container = document.getElementById('live-questions');
      container.innerHTML = '';
      
      if (questions.length === 0) {
        container.innerHTML = `<p class="text-center text-on-surface-variant mt-10">No questions found.</p>`;
        return;
      }

      questions.forEach((q, i) => {
        let inputHtml = '';
        if (q.question_type === 'MCQ') {
          const opts = q.options || [];
          inputHtml = opts.map(o => `
            <label class="flex items-center gap-3 p-3 rounded-xl border border-outline-variant hover:bg-surface-container cursor-pointer transition">
              <input type="radio" name="q_${q.id}" value="${o}" onchange="saveAnswer('${q.id}', '${o}')" class="text-secondary focus:ring-secondary w-4 h-4"/>
              <span class="text-sm font-medium text-on-surface">${o}</span>
            </label>
          `).join('');
        } else if (q.question_type === 'SHORT_ANSWER') {
          inputHtml = `<textarea onchange="saveAnswer('${q.id}', this.value)" rows="3" class="w-full border border-outline-variant rounded-xl p-3 text-sm focus:border-secondary outline-none" placeholder="Type your answer..."></textarea>`;
        }

        container.innerHTML += `
          <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-6 shadow-sm">
            <div class="flex justify-between items-start mb-4">
              <h4 class="font-bold text-primary text-base"><span class="text-secondary mr-2">Q${i+1}.</span>${q.question_text}</h4>
              <span class="text-xs font-bold text-on-surface-variant bg-surface-container px-2 py-1 rounded">${q.marks} Marks</span>
            </div>
            <div class="space-y-2 mt-4">
              ${inputHtml}
            </div>
          </div>
        `;
      });
    }

    function saveAnswer(question_id, answer) {
      const existing = answersState.find(a => a.question_id === question_id);
      if (existing) existing.answer = answer;
      else answersState.push({ question_id, answer });
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      
      const timerEl = document.getElementById('live-timer');
      
      timerInterval = setInterval(() => {
        const now = new Date();
        const diff = examEndTime - now;

        if (diff <= 0) {
          clearInterval(timerInterval);
          timerEl.textContent = "00:00";
          timerEl.classList.add('text-red-300');
          alert("Time is up! Your exam will be auto-submitted.");
          submitExam();
          return;
        }

        const m = Math.floor(diff / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        timerEl.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        
        if (m < 5) timerEl.classList.add('text-red-300');
      }, 1000);
    }

    async function submitExam() {
      if (timerInterval) clearInterval(timerInterval);
      const btn = document.getElementById('btn-submit');
      btn.disabled = true; btn.textContent = 'Submitting...';

      try {
        const res = await PzAPI.authPost(`/exams/${currentExamId}/submit`, { answers: answersState });
        if (res.success) {
          alert(`Exam submitted successfully! Score: ${res.data.percentage}%`);
          window.location.reload();
        } else {
          alert(res.message || 'Error submitting exam');
          btn.disabled = false; btn.textContent = 'Submit Exam';
        }
      } catch (err) {
        alert('Submission failed: ' + err.message);
        btn.disabled = false; btn.textContent = 'Submit Exam';
      }
    }
  </script>
</body>
</html>
