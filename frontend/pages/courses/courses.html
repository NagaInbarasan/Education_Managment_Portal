<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Academic Course Catalog — Phazon</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/variables.css"/>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/components.css"/>
  <link rel="stylesheet" href="../../css/layout.css"/>
  <link rel="stylesheet" href="../../css/responsive.css"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#000000", "secondary": "#4648d4", "background": "#f8f9ff",
            "surface": "#f8f9ff", "on-surface": "#0d1c2e", "on-surface-variant": "#45464d",
            "outline-variant": "#c6c6cd", "surface-container-lowest": "#ffffff", "surface-container-high": "#dce9ff"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex antialiased">
  
  <!-- SideNavBar -->
  <nav class="hidden md:flex fixed left-0 top-0 h-full w-[280px] z-50 border-r border-outline-variant bg-surface flex-col py-6">
    <div class="px-6 mb-8">
      <a href="../../index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-sm">
          <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">school</span>
        </div>
        <div>
          <span class="font-bold text-lg text-primary block leading-tight">Phazon Academic</span>
          <p class="text-xs text-secondary font-semibold">Course Catalog</p>
        </div>
      </a>
    </div>

    <div class="flex-1 flex flex-col gap-1 pr-4 font-medium text-sm">
      <a class="flex items-center gap-3 text-on-surface-variant py-3 px-6 hover:bg-surface-container-high rounded-r-full hover:text-primary transition-all" href="../student/dashboard.html">
        <span class="material-symbols-outlined">dashboard</span>Dashboard
      </a>
      <a class="flex items-center gap-3 bg-secondary text-white rounded-r-full py-3 px-6 font-semibold shadow-sm" href="courses.html">
        <span class="material-symbols-outlined">school</span>Course Catalog
      </a>
      <a class="flex items-center gap-3 text-on-surface-variant py-3 px-6 hover:bg-surface-container-high rounded-r-full hover:text-primary transition-all" href="../student/attendance.html">
        <span class="material-symbols-outlined">fact_check</span>Attendance
      </a>
      <a class="flex items-center gap-3 text-on-surface-variant py-3 px-6 hover:bg-surface-container-high rounded-r-full hover:text-primary transition-all" href="../student/assignments.html">
        <span class="material-symbols-outlined">assignment</span>Assignments
      </a>
      <a class="flex items-center gap-3 text-on-surface-variant py-3 px-6 hover:bg-surface-container-high rounded-r-full hover:text-primary transition-all" href="../student/exams.html">
        <span class="material-symbols-outlined">quiz</span>Exams
      </a>
      <a class="flex items-center gap-3 text-on-surface-variant py-3 px-6 hover:bg-surface-container-high rounded-r-full hover:text-primary transition-all" href="../student/grades.html">
        <span class="material-symbols-outlined">grade</span>Grades
      </a>
    </div>

    <div class="px-6 mt-auto">
      <button onclick="PzAuth.logout()" class="w-full bg-red-50 text-red-600 hover:bg-red-100 transition-colors py-2.5 px-4 rounded-xl font-semibold text-xs flex justify-center items-center gap-2">
        <span class="material-symbols-outlined text-[18px]">logout</span>Sign Out
      </button>
    </div>
  </nav>

  <!-- Main Content Canvas -->
  <main class="flex-1 md:ml-[280px] min-w-0 p-4 md:p-8 max-w-[1280px] mx-auto w-full flex flex-col gap-8">
    
    <!-- Top Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pt-2 border-b border-outline-variant/60 pb-6">
      <div class="space-y-1">
        <h1 class="font-headline-lg text-2xl md:text-3xl font-extrabold text-primary">Academic Subjects & Course Catalog</h1>
        <p class="text-xs md:text-sm text-on-surface-variant">Explore structured curriculum modules across AI & Data Science, Computer Science, and Engineering departments.</p>
      </div>

      <!-- Search Box -->
      <div class="relative w-full md:w-72">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
        <input type="text" id="pz-course-search" placeholder="Search courses or codes..." 
               class="w-full pl-9 pr-4 py-2 border border-outline-variant rounded-xl bg-surface-container-lowest text-xs focus:ring-2 focus:ring-secondary focus:border-secondary transition-all outline-none"/>
      </div>
    </header>

    <!-- Department Filter Pills -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
      <button class="pz-dept-filter px-4 py-1.5 rounded-full text-xs font-semibold bg-secondary text-white transition-all cursor-pointer flex-shrink-0" data-dept="all">
        All Departments
      </button>
      <button class="pz-dept-filter px-4 py-1.5 rounded-full text-xs font-semibold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-all cursor-pointer flex-shrink-0" data-dept="AIDS">
        AI & Data Science (AIDS)
      </button>
      <button class="pz-dept-filter px-4 py-1.5 rounded-full text-xs font-semibold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-all cursor-pointer flex-shrink-0" data-dept="CSE">
        Computer Science (CSE)
      </button>
      <button class="pz-dept-filter px-4 py-1.5 rounded-full text-xs font-semibold bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-all cursor-pointer flex-shrink-0" data-dept="ECE">
        Electronics (ECE)
      </button>
    </div>

    <!-- Course Cards Grid -->
    <section id="pz-courses-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Populated dynamically -->
    </section>
  </main>

  <script src="../../js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/state.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../../js/auth-client.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/courses.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!PzAuth.requireAuthGuard()) return;
    });
  </script>
</body>
</html>
