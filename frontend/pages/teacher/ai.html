<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Phazon Academic — Teacher AI Assistant</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/variables.css"/>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/components.css"/>
  <link rel="stylesheet" href="../../css/layout.css"/>
  <link rel="stylesheet" href="../../css/responsive.css"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#000000", "secondary": "#4648d4", "background": "#f8f9ff",
            "surface": "#f8f9ff", "on-surface": "#0d1c2e", "on-surface-variant": "#45464d",
            "outline-variant": "#c6c6cd", "surface-container-lowest": "#ffffff",
            "surface-container-high": "#dce9ff", "surface-container": "#e6eeff",
            "primary-container": "#131b2e", "on-primary-container": "#bec6e0"
          }
        }
      }
    }
  </style>
  <style>
    .nav-item { @apply flex items-center gap-3 text-on-surface-variant py-2.5 px-4 rounded-lg hover:bg-surface-container hover:text-primary transition-all duration-150 font-medium text-sm; }
    .nav-item.active { @apply bg-secondary text-white; }
    .nav-item .icon { @apply text-[20px]; }
    .nav-section { @apply text-[10px] font-bold uppercase tracking-widest text-on-surface-variant px-4 pt-4 pb-1; }
  </style>
</head>
<body class="bg-background text-on-surface h-full font-sans antialiased flex overflow-hidden">

  <!-- SideNav -->
  <nav class="hidden md:flex flex-col h-screen w-[260px] z-50 bg-surface border-r border-outline-variant flex-shrink-0">
    <div class="px-5 pt-6 pb-4 flex items-center gap-3 border-b border-outline-variant">
      <div class="w-9 h-9 rounded-xl bg-secondary flex items-center justify-center shadow-sm flex-shrink-0">
        <span class="material-symbols-outlined text-white text-[18px]" style="font-variation-settings:'FILL' 1">co_present</span>
      </div>
      <div class="min-w-0">
        <a href="../../index.html" class="font-bold text-primary text-base block truncate leading-tight">Phazon Academic</a>
        <p class="text-xs text-secondary font-semibold">Teacher Portal</p>
      </div>
    </div>

    <div class="px-4 py-3 border-b border-outline-variant">
      <div class="flex items-center gap-2.5 bg-surface-container rounded-xl px-3 py-2">
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white text-sm flex-shrink-0">
          <span class="material-symbols-outlined text-[16px]">co_present</span>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-primary truncate" id="nav-name">Teacher</p>
          <p class="text-xs text-on-surface-variant truncate" id="nav-email">teacher@phazon.edu</p>
        </div>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto px-3 py-2 space-y-0.5">
      <p class="nav-section">Overview</p>
      <a href="dashboard.html"                 class="nav-item"><span class="icon material-symbols-outlined">dashboard</span>Overview</a>
      <p class="nav-section">Academic</p>
      <a href="attendance.html"                class="nav-item"><span class="icon material-symbols-outlined">fact_check</span>Attendance</a>
      <a href="assignments.html"               class="nav-item"><span class="icon material-symbols-outlined">assignment</span>Assignments</a>
      <a href="exams.html"                     class="nav-item"><span class="icon material-symbols-outlined">quiz</span>Exams</a>
      <a href="analytics.html"                 class="nav-item"><span class="icon material-symbols-outlined">analytics</span>Analytics</a>
      <a href="ai.html"                        class="nav-item active"><span class="icon material-symbols-outlined">auto_awesome</span>AI Assistant</a>
    </div>

    <div class="px-3 py-4 border-t border-outline-variant space-y-1">
      <button onclick="PzAuth.logout()" class="nav-item w-full text-left text-red-600 hover:bg-red-50 hover:text-red-700">
        <span class="icon material-symbols-outlined">logout</span>Logout
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-full overflow-y-auto relative">
    <div class="bg-surface border-b border-outline-variant px-6 py-4 flex items-center justify-between sticky top-0 z-10">
      <div>
        <h1 class="text-xl font-bold text-primary">Teacher AI Academic Assistant</h1>
        <p class="text-xs text-on-surface-variant mt-0.5">Authorized class summaries, attention insights, and course performance analysis</p>
      </div>
      <span class="inline-flex items-center gap-1.5 bg-secondary/10 text-secondary text-xs font-bold px-3 py-1 rounded-full">
        <span class="material-symbols-outlined text-[13px]">auto_awesome</span>TEACHER AI
      </span>
    </div>

    <div class="p-6 flex-1 flex flex-col max-w-5xl mx-auto w-full space-y-6">
      <!-- Controls -->
      <div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-4 shadow-sm flex flex-col sm:flex-row gap-4 items-end">
        <div class="flex-1">
          <label class="block text-xs font-semibold text-on-surface mb-1">Class Context</label>
          <select id="sel-class" class="w-full border border-outline-variant rounded-lg px-3 py-2 text-xs bg-surface outline-none focus:border-secondary">
            <option value="">All Assigned Classes</option>
          </select>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex flex-wrap gap-2.5">
        <button onclick="sendQuickQuestion('Summarize my class overall performance and key observations.')" class="bg-surface-container-lowest border border-outline-variant hover:border-secondary px-4 py-2 rounded-xl text-xs font-semibold text-primary flex items-center gap-2 transition shadow-sm">
          <span class="material-symbols-outlined text-secondary text-[16px]">analytics</span> Summarize Class Performance
        </button>
        <button onclick="sendQuickQuestion('Which students in my class require academic attention based on attendance and assignment thresholds?')" class="bg-surface-container-lowest border border-outline-variant hover:border-secondary px-4 py-2 rounded-xl text-xs font-semibold text-primary flex items-center gap-2 transition shadow-sm">
          <span class="material-symbols-outlined text-amber-600 text-[16px]">priority_high</span> Which students need attention?
        </button>
      </div>

      <!-- Chat Container -->
      <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-5 shadow-sm flex flex-col justify-between h-[480px]">
        <div id="chat-messages" class="flex-1 overflow-y-auto space-y-4 pr-2">
          <div class="bg-surface-container p-4 rounded-2xl max-w-[85%] text-xs text-on-surface">
            <p class="font-semibold text-secondary mb-1 flex items-center gap-1">
              <span class="material-symbols-outlined text-[15px]">auto_awesome</span> Faculty AI Companion
            </p>
            Welcome, Professor! Select a class context above or ask any question about your assigned class performance, attendance trends, or grade distribution.
          </div>
        </div>

        <form onsubmit="handleChatSubmit(event)" class="mt-4 pt-3 border-t border-outline-variant flex items-center gap-2">
          <input id="chat-input" type="text" placeholder="Ask about your assigned classes..." class="flex-1 border border-outline-variant rounded-xl px-4 py-2.5 text-xs bg-surface outline-none focus:border-secondary"/>
          <button type="submit" id="btn-send" class="bg-secondary text-white font-semibold px-5 py-2.5 rounded-xl hover:opacity-90 transition text-xs flex items-center gap-1.5 shadow-md">
            <span>Send</span>
            <span class="material-symbols-outlined text-[16px]">send</span>
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="../../js/config.js"></script>
<script src="../../js/state.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!PzAuth.requireAuthGuard('teacher')) return;
      
      const session = JSON.parse(localStorage.getItem('pz_auth_session') || 'null');
      document.getElementById('nav-name').textContent = session.user.name;
      document.getElementById('nav-email').textContent = session.user.email;

      await loadClasses();
    });

    async function loadClasses() {
      try {
        const res = await PzAPI.authGet('/teacher-assignments');
        if (res.success && res.data) {
          const sel = document.getElementById('sel-class');
          const added = new Set();
          res.data.forEach(a => {
            if (a.class && !added.has(a.class.id)) {
              added.add(a.class.id);
              const opt = document.createElement('option');
              opt.value = a.class.id;
              opt.textContent = a.class.name;
              sel.appendChild(opt);
            }
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    function appendMessage(sender, text, isAi = false) {
      const container = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      
      if (isAi) {
        msgDiv.className = "bg-surface-container p-4 rounded-2xl max-w-[85%] text-xs text-on-surface";
        msgDiv.innerHTML = `
          <p class="font-semibold text-secondary mb-1 flex items-center gap-1">
            <span class="material-symbols-outlined text-[15px]">auto_awesome</span> Faculty AI Companion
          </p>
          <div class="space-y-2">${text}</div>
        `;
      } else {
        msgDiv.className = "bg-secondary text-white p-3.5 rounded-2xl max-w-[80%] text-xs ml-auto shadow-sm";
        msgDiv.textContent = text;
      }

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    async function handleChatSubmit(event) {
      event.preventDefault();
      const input = document.getElementById('chat-input');
      const q = input.value.trim();
      if (!q) return;

      const class_id = document.getElementById('sel-class').value;

      input.value = '';
      appendMessage('Teacher', q, false);
      
      const btn = document.getElementById('btn-send');
      btn.disabled = true;

      try {
        const res = await PzAPI.authPost('/ai/academic-assistant', { question: q, class_id });
        if (res.success && res.data) {
          const ans = res.data;
          let bodyHtml = `<p>${ans.answer || ans.summary || 'Processing complete.'}</p>`;
          
          if (ans.evidence && ans.evidence.length > 0) {
            bodyHtml += `<div class="mt-2 pt-2 border-t border-outline-variant/30 font-medium"><strong>Evidence:</strong> <ul class="list-disc pl-4 mt-1">${ans.evidence.map(e => `<li>${e}</li>`).join('')}</ul></div>`;
          }
          if (ans.recommendations && ans.recommendations.length > 0) {
            bodyHtml += `<div class="mt-2 font-medium text-secondary font-semibold"><strong>Action Items:</strong> <ul class="list-disc pl-4 mt-1">${ans.recommendations.map(r => `<li>${r}</li>`).join('')}</ul></div>`;
          }

          appendMessage('AI', bodyHtml, true);
        } else {
          appendMessage('AI', 'Could not complete request.', true);
        }
      } catch (err) {
        appendMessage('AI', `Error: ${err.message}`, true);
      } finally {
        btn.disabled = false;
      }
    }

    function sendQuickQuestion(q) {
      document.getElementById('chat-input').value = q;
      document.querySelector('form').dispatchEvent(new Event('submit'));
    }
  </script>
</body>
</html>
