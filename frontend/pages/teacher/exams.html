<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Phazon Academic — Manage Exams</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/variables.css"/>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/components.css"/>
  <link rel="stylesheet" href="../../css/layout.css"/>
  <link rel="stylesheet" href="../../css/responsive.css"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#000000", "secondary": "#4648d4", "background": "#f8f9ff",
            "surface": "#f8f9ff", "on-surface": "#0d1c2e", "on-surface-variant": "#45464d",
            "outline-variant": "#c6c6cd", "surface-container-lowest": "#ffffff",
            "surface-container-high": "#dce9ff", "surface-container": "#e6eeff",
            "primary-container": "#131b2e", "on-primary-container": "#bec6e0"
          }
        }
      }
    }
  </script>
  <style>
    .nav-item { @apply flex items-center gap-3 text-on-surface-variant py-2.5 px-4 rounded-lg hover:bg-surface-container hover:text-primary transition-all duration-150 font-medium text-sm; }
    .nav-item.active { @apply bg-secondary text-white; }
    .nav-item .icon { @apply text-[20px]; }
    .nav-section { @apply text-[10px] font-bold uppercase tracking-widest text-on-surface-variant px-4 pt-4 pb-1; }
  </style>
</head>
<body class="bg-background text-on-surface h-full font-sans antialiased flex overflow-hidden">

  <!-- SideNav -->
  <nav class="hidden md:flex flex-col h-screen w-[260px] z-50 bg-surface border-r border-outline-variant flex-shrink-0">
    <div class="px-5 pt-6 pb-4 flex items-center gap-3 border-b border-outline-variant">
      <div class="w-9 h-9 rounded-xl bg-secondary flex items-center justify-center shadow-sm flex-shrink-0">
        <span class="material-symbols-outlined text-white text-[18px]" style="font-variation-settings:'FILL' 1">co_present</span>
      </div>
      <div class="min-w-0">
        <a href="../../index.html" class="font-bold text-primary text-base block truncate leading-tight">Phazon Academic</a>
        <p class="text-xs text-secondary font-semibold">Teacher Portal</p>
      </div>
    </div>

    <div class="px-4 py-3 border-b border-outline-variant">
      <div class="flex items-center gap-2.5 bg-surface-container rounded-xl px-3 py-2">
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white text-sm flex-shrink-0">
          <span class="material-symbols-outlined text-[16px]">co_present</span>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-primary truncate" id="nav-name">Teacher</p>
          <p class="text-xs text-on-surface-variant truncate" id="nav-email">teacher@phazon.edu</p>
        </div>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto px-3 py-2 space-y-0.5">
      <p class="nav-section">Overview</p>
      <a href="dashboard.html"                 class="nav-item"><span class="icon material-symbols-outlined">dashboard</span>Dashboard</a>
      <p class="nav-section">Academic</p>
      <a href="attendance.html"                class="nav-item"><span class="icon material-symbols-outlined">fact_check</span>Attendance</a>
      <a href="assignments.html"               class="nav-item"><span class="icon material-symbols-outlined">assignment</span>Assignments</a>
      <a href="exams.html"                     class="nav-item active"><span class="icon material-symbols-outlined">quiz</span>Exams</a>
    </div>

    <div class="px-3 py-4 border-t border-outline-variant space-y-1">
      <button onclick="PzAuth.logout()" class="nav-item w-full text-left text-red-600 hover:bg-red-50 hover:text-red-700">
        <span class="icon material-symbols-outlined">logout</span>Logout
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-full overflow-y-auto">
    <div class="bg-surface border-b border-outline-variant px-6 py-4 flex items-center justify-between sticky top-0 z-10">
      <div>
        <h1 class="text-xl font-bold text-primary">Exam Management</h1>
        <p class="text-xs text-on-surface-variant mt-0.5">Create and schedule deterministic examinations</p>
      </div>
      <span class="inline-flex items-center gap-1.5 bg-secondary/10 text-secondary text-xs font-bold px-3 py-1 rounded-full">
        <span class="material-symbols-outlined text-[13px]">co_present</span>TEACHER
      </span>
    </div>

    <div class="p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-primary">Your Exams</h2>
        <button onclick="showCreateModal()" class="bg-secondary text-white font-semibold py-2 px-4 rounded-lg hover:opacity-90 transition-opacity text-sm flex items-center gap-2 shadow-md">
          <span class="material-symbols-outlined text-[18px]">add</span> Create Exam
        </button>
      </div>

      <!-- Exams Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="list-exams">
        <!-- Rendered via JS -->
      </div>
    </div>
  </main>

  <!-- Create Modal -->
  <div id="create-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
    <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant shadow-xl w-full max-w-xl p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-5">
        <h3 class="font-bold text-primary text-base">New Exam Settings</h3>
        <button onclick="hideCreateModal()" class="w-8 h-8 rounded-lg hover:bg-surface-container flex items-center justify-center text-on-surface-variant transition-colors">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-on-surface mb-1.5">Exam Title *</label>
          <input id="ex-title" type="text" placeholder="e.g. Midterm 1" class="w-full border border-outline-variant rounded-lg px-3 py-2 text-sm bg-surface outline-none focus:border-secondary"/>
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-on-surface mb-1.5">Class *</label>
            <select id="ex-class" class="w-full border border-outline-variant rounded-lg px-3 py-2 text-sm bg-surface outline-none focus:border-secondary"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-on-surface mb-1.5">Subject *</label>
            <select id="ex-subject" class="w-full border border-outline-variant rounded-lg px-3 py-2 text-sm bg-surface outline-none focus:border-secondary"></select>
          </div>
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-on-surface mb-1.5">Exam Type</label>
            <select id="ex-type" class="w-full border border-outline-variant rounded-lg px-3 py-2 text-sm bg-surface outline-none focus:border-secondary">
              <option value="INTERNAL">Internal</option>
              <option value="MIDTERM">Midterm</option>
              <option value="MODEL">Model</option>
              <option value="FINAL">Final</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-on-surface mb-1.5">Duration (Minutes)</label>
            <input id="ex-dur" type="number" value="60" class="w-full border border-outline-variant rounded-lg px-3 py-2 text-sm bg-surface outline-none focus:border-secondary"/>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-on-surface mb-1.5">Start Time</label>
            <input id="ex-start" type="datetime-local" class="w-full border border-outline-variant rounded-lg px-3 py-2 text-sm bg-surface outline-none focus:border-secondary"/>
          </div>
          <div>
            <label class="block text-xs font-semibold text-on-surface mb-1.5">End Time</label>
            <input id="ex-end" type="datetime-local" class="w-full border border-outline-variant rounded-lg px-3 py-2 text-sm bg-surface outline-none focus:border-secondary"/>
          </div>
        </div>

        <button onclick="submitExam()" id="btn-submit" class="w-full bg-secondary text-white font-semibold py-2.5 rounded-lg hover:opacity-90 transition-opacity text-sm mt-4">
          Save Draft
        </button>
      </div>
    </div>
  </div>

  <script src="../../js/state.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth-client.js"></script>
  <script>
    let examsList = [];
    let classesMap = {};
    let teacherAssg = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!PzAuth.requireAuthGuard('teacher')) return;
      
      const session = JSON.parse(localStorage.getItem('pz_auth_session') || 'null');
      document.getElementById('nav-name').textContent = session.user.name;
      document.getElementById('nav-email').textContent = session.user.email;

      await loadTeacherAssignments();
      await loadExams();
    });

    async function loadTeacherAssignments() {
      try {
        const res = await PzAPI.authGet('/teacher-assignments');
        if (res.success && res.data) {
          teacherAssg = res.data;
          const classSel = document.getElementById('ex-class');
          
          teacherAssg.forEach(a => {
            if (a.class) classesMap[a.class.id] = a.class.name;
          });
          
          Object.entries(classesMap).forEach(([id, name]) => {
            const opt = document.createElement('option');
            opt.value = id; opt.textContent = name; classSel.appendChild(opt);
          });

          classSel.addEventListener('change', () => {
            const subSel = document.getElementById('ex-subject');
            subSel.innerHTML = '';
            const cid = classSel.value;
            const subs = teacherAssg.filter(a => a.class_id === cid);
            subs.forEach(a => {
              if (a.subject) {
                const opt = document.createElement('option');
                opt.value = a.subject.id; opt.textContent = `${a.subject.name} (${a.subject.code})`;
                subSel.appendChild(opt);
              }
            });
          });
          if(Object.keys(classesMap).length > 0) classSel.dispatchEvent(new Event('change'));
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadExams() {
      try {
        const res = await PzAPI.authGet('/exams');
        if (res.success) {
          examsList = res.data || [];
          renderExams();
        }
      } catch (err) {
        console.error(err);
      }
    }

    function renderExams() {
      const container = document.getElementById('list-exams');
      container.innerHTML = '';
      if (examsList.length === 0) {
        container.innerHTML = `<div class="col-span-full text-sm text-on-surface-variant">No exams found.</div>`;
        return;
      }

      examsList.forEach(ex => {
        let statusClass = 'bg-gray-100 text-gray-800';
        if (ex.status === 'PUBLISHED') statusClass = 'bg-blue-100 text-blue-800';
        if (ex.status === 'SCHEDULED') statusClass = 'bg-purple-100 text-purple-800';
        if (ex.status === 'LIVE') statusClass = 'bg-green-100 text-green-800';
        if (ex.status === 'COMPLETED') statusClass = 'bg-red-100 text-red-800';

        const startStr = ex.start_at ? new Date(ex.start_at).toLocaleString() : 'TBD';

        container.innerHTML += `
          <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-5 shadow-sm flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-2">
                <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded ${statusClass}">${ex.status}</span>
                <span class="text-xs font-semibold text-on-surface-variant">${ex.duration_minutes} min</span>
              </div>
              <h3 class="font-bold text-primary text-base">${ex.title}</h3>
              <p class="text-xs font-semibold text-secondary mt-1">${ex.subject?.name || ''} — ${ex.class?.name || ''}</p>
            </div>
            <div class="mt-5 border-t border-outline-variant pt-4 space-y-2">
              <div class="text-xs font-medium text-on-surface-variant">
                <span class="material-symbols-outlined text-[14px] align-middle mr-1">schedule</span>${startStr}
              </div>
              <div class="flex gap-2">
                <button onclick="publishExam('${ex.id}')" class="flex-1 bg-surface-container text-primary text-xs font-bold py-1.5 rounded hover:bg-gray-200 transition">Publish</button>
                <button onclick="alert('Manage questions UI not in demo scope')" class="flex-1 bg-secondary/10 text-secondary text-xs font-bold py-1.5 rounded hover:bg-secondary/20 transition">Questions</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function showCreateModal() { document.getElementById('create-modal').classList.remove('hidden'); }
    function hideCreateModal() { document.getElementById('create-modal').classList.add('hidden'); }

    async function submitExam() {
      const title = document.getElementById('ex-title').value.trim();
      const class_id = document.getElementById('ex-class').value;
      const subject_id = document.getElementById('ex-subject').value;
      const exam_type = document.getElementById('ex-type').value;
      const duration = document.getElementById('ex-dur').value;
      const start = document.getElementById('ex-start').value;
      const end = document.getElementById('ex-end').value;

      if (!title || !class_id || !subject_id) return alert('Title, Class, and Subject are required.');

      const btn = document.getElementById('btn-submit');
      btn.disabled = true; btn.textContent = 'Saving...';

      try {
        const payload = { 
          title, class_id, subject_id, exam_type,
          duration_minutes: duration,
          start_at: start ? new Date(start).toISOString() : null,
          end_at: end ? new Date(end).toISOString() : null
        };
        const res = await PzAPI.authPost('/exams', payload);
        if (res.success) {
          hideCreateModal();
          await loadExams();
        } else {
          alert(res.message || 'Error creating exam');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false; btn.textContent = 'Save Draft';
      }
    }

    async function publishExam(id) {
      if (!confirm("Are you sure you want to publish this exam?")) return;
      try {
        const res = await PzAPI.authPatch(`/exams/${id}`, { status: 'PUBLISHED' });
        if (res.success) await loadExams();
        else alert(res.message || 'Error publishing');
      } catch (err) {
        alert(err.message);
      }
    }
  </script>
</body>
</html>
