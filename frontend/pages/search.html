<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Phazon Academic — Global Academic Search</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/responsive.css"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#000000", "secondary": "#4648d4", "background": "#f8f9ff",
            "surface": "#f8f9ff", "on-surface": "#0d1c2e", "on-surface-variant": "#45464d",
            "outline-variant": "#c6c6cd", "surface-container-lowest": "#ffffff",
            "surface-container-high": "#dce9ff", "surface-container": "#e6eeff",
            "primary-container": "#131b2e", "on-primary-container": "#bec6e0"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-surface h-full font-sans antialiased flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-surface border-b border-outline-variant px-6 py-4 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center shadow-sm">
        <span class="material-symbols-outlined text-white text-[18px]">school</span>
      </a>
      <div>
        <h1 class="text-xl font-bold text-primary">Global Academic Search Engine</h1>
        <p class="text-xs text-on-surface-variant mt-0.5">RBAC-scoped search across courses, assignments, exams, books, events, and support tickets</p>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col p-6 max-w-5xl mx-auto w-full space-y-6 overflow-y-auto">

    <!-- Search Input & Filters -->
    <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-4 shadow-sm space-y-3">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-on-surface-variant">search</span>
        <input id="search-input" type="text" placeholder="Type at least 2 characters to search..." onkeyup="onKey(event)" class="w-full text-sm bg-transparent outline-none border-none"/>
        <button onclick="executeSearch()" class="bg-secondary text-white font-semibold px-5 py-2 rounded-xl text-xs shadow-md">Search</button>
      </div>

      <div class="flex items-center gap-2 pt-2 border-t border-outline-variant/60 text-xs">
        <span class="font-bold text-on-surface-variant">Category:</span>
        <select id="search-cat" onchange="executeSearch()" class="border border-outline-variant rounded-lg px-2 py-1 text-xs bg-surface outline-none">
          <option value="ALL">All Categories</option>
          <option value="courses">Courses</option>
          <option value="assignments">Assignments</option>
          <option value="exams">Examinations</option>
          <option value="books">Library Books</option>
          <option value="events">Calendar Events</option>
          <option value="tickets">Support Tickets</option>
          <option value="students">Students / Staff</option>
        </select>
      </div>
    </div>

    <!-- Search Results List -->
    <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-5 shadow-sm space-y-4">
      <h2 class="font-bold text-primary text-base flex items-center gap-2">
        <span class="material-symbols-outlined text-secondary text-[20px]">manage_search</span> Search Results
      </h2>

      <div id="results-container" class="space-y-3">
        <p class="text-xs text-on-surface-variant py-4 text-center">Enter a search query above to discover authorized academic entities.</p>
      </div>
    </div>

  </main>

  <script src="../js/state.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth-client.js"></script>
  <script>
    function onKey(event) {
      if (event.key === 'Enter') executeSearch();
    }

    async function executeSearch() {
      const query = document.getElementById('search-input').value.trim();
      const cat = document.getElementById('search-cat').value;
      const container = document.getElementById('results-container');

      if (query.length < 2) {
        container.innerHTML = `<p class="text-xs text-on-surface-variant py-4 text-center">Type at least 2 characters to search.</p>`;
        return;
      }

      container.innerHTML = `<p class="text-xs text-on-surface-variant py-4 text-center">Searching...</p>`;

      try {
        const res = await PzAPI.authGet(`/search?query=${encodeURIComponent(query)}&category=${cat}`);
        if (res.success && res.data && res.data.length > 0) {
          container.innerHTML = '';
          res.data.forEach(item => {
            container.innerHTML += `
              <a href="${item.url}" class="block bg-surface p-4 rounded-xl border border-outline-variant/70 hover:border-secondary transition-all">
                <div class="flex items-center justify-between">
                  <h4 class="font-bold text-primary text-sm">${escapeHtml(item.title)}</h4>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-700">${item.type}</span>
                </div>
                <p class="text-xs text-on-surface-variant mt-1">${escapeHtml(item.subtitle)}</p>
              </a>
            `;
          });
        } else {
          container.innerHTML = `<p class="text-xs text-on-surface-variant py-6 text-center">No authorized academic entities found matching "${escapeHtml(query)}".</p>`;
        }
      } catch (err) {
        container.innerHTML = `<p class="text-xs text-red-600 py-6 text-center">Error executing search.</p>`;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
<script src="../js/config.js"></script>
</body>
</html>
