<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Phazon Academic — Admin Timetable & Rooms</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../css/variables.css"/>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/components.css"/>
  <link rel="stylesheet" href="../../css/layout.css"/>
  <link rel="stylesheet" href="../../css/responsive.css"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#000000", "secondary": "#4648d4", "background": "#f8f9ff",
            "surface": "#f8f9ff", "on-surface": "#0d1c2e", "on-surface-variant": "#45464d",
            "outline-variant": "#c6c6cd", "surface-container-lowest": "#ffffff",
            "surface-container-high": "#dce9ff", "surface-container": "#e6eeff",
            "primary-container": "#131b2e", "on-primary-container": "#bec6e0"
          }
        }
      }
    }
  </style>
  <style>
    .nav-item { @apply flex items-center gap-3 text-on-surface-variant py-2.5 px-4 rounded-lg hover:bg-surface-container hover:text-primary transition-all duration-150 font-medium text-sm; }
    .nav-item.active { @apply bg-secondary text-white; }
    .nav-item .icon { @apply text-[20px]; }
    .nav-section { @apply text-[10px] font-bold uppercase tracking-widest text-on-surface-variant px-4 pt-4 pb-1; }
  </style>
</head>
<body class="bg-background text-on-surface h-full font-sans antialiased flex overflow-hidden">

  <!-- SideNav -->
  <nav class="hidden md:flex flex-col h-screen w-[260px] z-50 bg-surface border-r border-outline-variant flex-shrink-0">
    <div class="px-5 pt-6 pb-4 flex items-center gap-3 border-b border-outline-variant">
      <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center shadow-sm flex-shrink-0">
        <span class="material-symbols-outlined text-white text-[18px]" style="font-variation-settings:'FILL' 1">admin_panel_settings</span>
      </div>
      <div class="min-w-0">
        <a href="../../index.html" class="font-bold text-primary text-base block truncate leading-tight">Phazon Academic</a>
        <p class="text-xs text-secondary font-semibold">Admin Portal</p>
      </div>
    </div>

    <div class="px-4 py-3 border-b border-outline-variant">
      <div class="flex items-center gap-2.5 bg-surface-container rounded-xl px-3 py-2">
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white text-sm flex-shrink-0">
          <span class="material-symbols-outlined text-[16px]">admin_panel_settings</span>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-primary truncate" id="nav-name">Admin</p>
          <p class="text-xs text-on-surface-variant truncate" id="nav-email">admin@phazon.edu</p>
        </div>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto px-3 py-2 space-y-0.5">
      <p class="nav-section">System</p>
      <a href="dashboard.html"                 class="nav-item"><span class="icon material-symbols-outlined">dashboard</span>Overview</a>
      <a href="structure.html"                 class="nav-item"><span class="icon material-symbols-outlined">account_balance</span>Academic Structure</a>

      <p class="nav-section">Academic</p>
      <a href="../courses/courses.html"         class="nav-item"><span class="icon material-symbols-outlined">menu_book</span>Courses</a>
      <a href="timetable.html"                 class="nav-item active"><span class="icon material-symbols-outlined">calendar_clock</span>Timetable & Rooms</a>
      <a href="resources.html"                 class="nav-item"><span class="icon material-symbols-outlined">folder</span>Resources</a>
      <a href="attendance.html"                 class="nav-item"><span class="icon material-symbols-outlined">fact_check</span>Attendance</a>
      <a href="assignments.html"                class="nav-item"><span class="icon material-symbols-outlined">assignment</span>Assignments</a>
      <a href="exams.html"                      class="nav-item"><span class="icon material-symbols-outlined">quiz</span>Exams</a>
      <a href="../grades/grades.html"           class="nav-item"><span class="icon material-symbols-outlined">grade</span>Grades</a>
      <a href="analytics.html"                  class="nav-item"><span class="icon material-symbols-outlined">analytics</span>Analytics</a>
      <a href="ai.html"                         class="nav-item"><span class="icon material-symbols-outlined">auto_awesome</span>AI Assistant</a>
      <a href="notifications.html"             class="nav-item"><span class="icon material-symbols-outlined">notifications</span>Notifications</a>
    </div>

    <div class="px-3 py-4 border-t border-outline-variant space-y-1">
      <button onclick="PzAuth.logout()" class="nav-item w-full text-left text-red-600 hover:bg-red-50 hover:text-red-700">
        <span class="icon material-symbols-outlined">logout</span>Logout
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-full overflow-y-auto">
    <div class="bg-surface border-b border-outline-variant px-6 py-4 flex items-center justify-between sticky top-0 z-10">
      <div>
        <h1 class="text-xl font-bold text-primary">Global Institution Schedule & Room Allocation</h1>
        <p class="text-xs text-on-surface-variant mt-0.5">Manage physical rooms, capacities, and monitor all academic timetables</p>
      </div>
      <button onclick="openRoomModal()" class="bg-secondary text-white font-semibold py-2 px-4 rounded-xl text-xs flex items-center gap-1.5 shadow-md">
        <span class="material-symbols-outlined text-[16px]">meeting_room</span> Add Room
      </button>
    </div>

    <div class="p-6 space-y-6 max-w-6xl mx-auto w-full">

      <!-- Add Room Modal -->
      <div id="room-modal" class="hidden bg-surface-container-lowest border border-outline-variant rounded-2xl p-5 shadow-lg space-y-4">
        <div class="flex justify-between items-center border-b border-outline-variant pb-3">
          <h3 class="font-bold text-primary text-base flex items-center gap-2">
            <span class="material-symbols-outlined text-secondary text-[20px]">meeting_room</span> Add Room / Lab
          </h3>
          <button onclick="closeRoomModal()" class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined">close</span></button>
        </div>

        <form onsubmit="submitRoom(event)" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-on-surface mb-1">Room Name</label>
              <input id="r-name" type="text" required placeholder="e.g. Room 302, Lab A" class="w-full border border-outline-variant rounded-lg px-3 py-2 text-xs bg-surface outline-none focus:border-secondary"/>
            </div>
            <div>
              <label class="block text-xs font-semibold text-on-surface mb-1">Building</label>
              <input id="r-bldg" type="text" placeholder="e.g. Science Block" class="w-full border border-outline-variant rounded-lg px-3 py-2 text-xs bg-surface outline-none focus:border-secondary"/>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-on-surface mb-1">Capacity</label>
              <input id="r-cap" type="number" min="1" value="60" required class="w-full border border-outline-variant rounded-lg px-3 py-2 text-xs bg-surface outline-none focus:border-secondary"/>
            </div>
            <div>
              <label class="block text-xs font-semibold text-on-surface mb-1">Room Type</label>
              <select id="r-type" required class="w-full border border-outline-variant rounded-lg px-3 py-2 text-xs bg-surface outline-none focus:border-secondary">
                <option value="CLASSROOM">Classroom</option>
                <option value="LAB">Lab</option>
                <option value="SEMINAR_HALL">Seminar Hall</option>
                <option value="AUDITORIUM">Auditorium</option>
                <option value="OTHER">Other</option>
              </select>
            </div>
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeRoomModal()" class="px-4 py-2 rounded-lg text-xs font-semibold text-on-surface-variant hover:bg-surface-container">Cancel</button>
            <button type="submit" id="btn-save-room" class="bg-secondary text-white font-semibold px-5 py-2 rounded-lg text-xs shadow-md">Add Room</button>
          </div>
        </form>
      </div>

      <!-- Rooms Grid -->
      <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-5 shadow-sm space-y-4">
        <h2 class="font-bold text-primary text-base flex items-center gap-2">
          <span class="material-symbols-outlined text-secondary text-[20px]">meeting_room</span> Configured Academic Rooms
        </h2>
        <div id="rooms-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <!-- Rendered via JS -->
        </div>
      </div>

      <!-- All Timetable Entries Table -->
      <div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-5 shadow-sm space-y-4">
        <h2 class="font-bold text-primary text-base flex items-center gap-2">
          <span class="material-symbols-outlined text-secondary text-[20px]">table_chart</span> Global Institution Timetable Log
        </h2>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse min-w-[750px]">
            <thead>
              <tr class="bg-surface border-b border-outline-variant text-[11px] font-bold text-on-surface-variant uppercase">
                <th class="py-3 px-3">Status</th>
                <th class="py-3 px-3">Class</th>
                <th class="py-3 px-3">Day & Period</th>
                <th class="py-3 px-3">Course</th>
                <th class="py-3 px-3">Faculty</th>
                <th class="py-3 px-3">Room</th>
                <th class="py-3 px-3">Action</th>
              </tr>
            </thead>
            <tbody id="timetable-body" class="divide-y divide-outline-variant/60 text-xs">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="../../js/state.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!PzAuth.requireAuthGuard('admin')) return;
      
      const session = JSON.parse(localStorage.getItem('pz_auth_session') || 'null');
      document.getElementById('nav-name').textContent = session.user.name;
      document.getElementById('nav-email').textContent = session.user.email;

      await loadRooms();
      await loadTimetable();
    });

    async function loadRooms() {
      const container = document.getElementById('rooms-grid');
      try {
        const res = await PzAPI.authGet('/rooms');
        if (res.success && res.data && res.data.length > 0) {
          container.innerHTML = '';
          res.data.forEach(r => {
            container.innerHTML += `
              <div class="bg-surface p-4 rounded-xl border border-outline-variant/70 flex flex-col justify-between space-y-2">
                <div>
                  <div class="flex items-center justify-between">
                    <h4 class="font-bold text-primary text-sm">${escapeHtml(r.name)}</h4>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-surface-container text-secondary">${r.room_type}</span>
                  </div>
                  <p class="text-xs text-on-surface-variant">${escapeHtml(r.building || 'Main Block')}</p>
                </div>
                <div class="flex items-center justify-between border-t border-outline-variant/60 pt-2 text-xs">
                  <span class="text-on-surface font-semibold">Capacity: ${r.capacity}</span>
                  <button onclick="deleteRoom('${r.id}')" class="text-red-600 font-semibold hover:underline">Delete</button>
                </div>
              </div>
            `;
          });
        } else {
          container.innerHTML = `<div class="col-span-full py-6 text-center text-xs text-on-surface-variant">No rooms configured.</div>`;
        }
      } catch (err) {
        container.innerHTML = `<div class="col-span-full py-6 text-center text-xs text-red-600">Error loading rooms.</div>`;
      }
    }

    async function loadTimetable() {
      const container = document.getElementById('timetable-body');
      try {
        const res = await PzAPI.authGet('/timetable');
        if (res.success && res.data && res.data.length > 0) {
          container.innerHTML = '';
          res.data.forEach(e => {
            const badgeClass = e.status === 'PUBLISHED' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700';
            container.innerHTML += `
              <tr class="hover:bg-surface/50">
                <td class="py-3 px-3"><span class="text-[10px] font-bold px-2 py-0.5 rounded ${badgeClass}">${e.status}</span></td>
                <td class="py-3 px-3 font-bold text-primary">${escapeHtml(e.class?.name || 'Class')}</td>
                <td class="py-3 px-3 font-semibold text-secondary">${e.day_of_week} (P${e.period_number})<br/><span class="text-[10px] text-on-surface-variant">${e.start_time} - ${e.end_time}</span></td>
                <td class="py-3 px-3 font-bold text-primary">${escapeHtml(e.course?.name || 'Course')}</td>
                <td class="py-3 px-3 text-on-surface-variant">${escapeHtml(e.teacher?.name || 'Faculty')}</td>
                <td class="py-3 px-3 font-semibold text-on-surface">${escapeHtml(e.room?.name || 'TBA')}</td>
                <td class="py-3 px-3"><button onclick="deleteEntry('${e.id}')" class="text-red-600 font-semibold hover:underline">Delete</button></td>
              </tr>
            `;
          });
        } else {
          container.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-xs text-on-surface-variant">No global timetable entries found.</td></tr>`;
        }
      } catch (err) {
        container.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-xs text-red-600">Error loading timetable.</td></tr>`;
      }
    }

    function openRoomModal() { document.getElementById('room-modal').classList.remove('hidden'); }
    function closeRoomModal() { document.getElementById('room-modal').classList.add('hidden'); }

    async function submitRoom(event) {
      event.preventDefault();
      const name = document.getElementById('r-name').value.trim();
      const building = document.getElementById('r-bldg').value.trim();
      const capacity = document.getElementById('r-cap').value;
      const room_type = document.getElementById('r-type').value;

      try {
        const res = await PzAPI.authPost('/rooms', { name, building, capacity, room_type });
        if (res.success) {
          closeRoomModal();
          await loadRooms();
        } else {
          alert(res.message || 'Failed to add room');
        }
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteRoom(id) {
      if (!confirm('Are you sure you want to delete this room?')) return;
      try {
        await PzAPI.authDelete(`/rooms/${id}`);
        await loadRooms();
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteEntry(id) {
      if (!confirm('Are you sure you want to delete this timetable entry?')) return;
      try {
        await PzAPI.authDelete(`/timetable/${id}`);
        await loadTimetable();
      } catch (err) {
        alert(err.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
